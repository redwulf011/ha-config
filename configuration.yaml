# Loads default set of integrations. Do not remove.
default_config:

shell_command:
  batt_backup: "python3 /var/snap/home-assistant-snap/695/www/set_battery_mode.py backup"
  batt_self_consumption: "python3 /var/snap/home-assistant-snap/695/www/set_battery_mode.py self-consumption"

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

input_select:
  sim_algo_zustand:
    name: "Sim Algo Zustand"
    options:
      - "Warte Überschuss"
      - "Laden 6A"
      - "Laden 7A"
      - "Laden 8A"
      - "Laden 9A"
      - "Laden 10A"
    initial: "Warte Überschuss"
    icon: mdi:state-machine

template:
  - sensor:
      # Batterieleistung (kW) - berechnet
      - name: "Envoy Batterieleistung"
        unique_id: envoy_batterieleistung_v2
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: >
          {% set w = states('sensor.encharge_122312090301_leistung') | float(0) %}
          {{ (w / 1000) | round(3) }}
        availability: >
          {{ states('sensor.encharge_122312090301_leistung') not in ['unavailable', 'none'] }}

      # Netzimport (nur positive Werte)
      - name: "Netzimport Leistung"
        unique_id: netzimport_leistung
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: >
          {% set n = states('sensor.envoy_122323101510_aktueller_nettostromverbrauch') | float(0) %}
          {% if n > 0 %}{{ n }}{% else %}0{% endif %}

      # Netzeinspeisung (positive Werte, ursprünglich negative)
      - name: "Netzeinspeisung Leistung"
        unique_id: netzeinspeisung_leistung
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: >
          {% set n = states('sensor.envoy_122323101510_aktueller_nettostromverbrauch') | float(0) %}
          {% if n < 0 %}{{ (n * -1) | round(3) }}{% else %}0{% endif %}

      # Batterieladung (nur negative Werte = laden, positiv dargestellt)
      - name: "Batterieladung Leistung"
        unique_id: batterieladung_leistung
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: >
          {% set b = states('sensor.envoy_batterieleistung') | float(0) %}
          {% if b < 0 %}{{ (b * -1) | round(3) }}{% else %}0{% endif %}

      # Connector Status Deutsch
      - name: "Fahrzeug Status"
        unique_id: fahrzeug_status
        state: >
          {% set s = states('sensor.sim_eff_connector') %}
          {% set map = {
            'Available': 'Nicht eingesteckt',
            'Preparing': 'Eingesteckt',
            'Charging': 'Lädt',
            'Finishing': 'Beendet',
            'SuspendedEV': 'Auto pausiert',
            'SuspendedEVSE': 'Wallbox pausiert',
            'Reserved': 'Reserviert',
            'Unavailable': 'Nicht verfügbar',
            'Faulted': 'Fehler'
          } %}
          {{ map.get(s, s) }}
        icon: >
          {% set s = states('sensor.vestel_ev_status_connector') %}
          {% if s == 'Charging' %}mdi:ev-station{% elif s == 'Preparing' %}mdi:power-plug{% elif s == 'Available' %}mdi:power-plug-off{% else %}mdi:help-circle{% endif %}

      # Algorithmus-Überwachung
      - name: "PV Überschuss"
        unique_id: pv_ueberschuss
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: >
          {% set n = states('sensor.envoy_122323101510_aktueller_nettostromverbrauch') | float(0) %}
          {% if n < 0 %}{{ (n * -1) | round(2) }}{% else %}0{% endif %}

      - name: "Berechneter Zielstrom"
        unique_id: berechneter_zielstrom
        unit_of_measurement: "A"
        state: >
          {% set s = states('sensor.pv_uberschuss') | float(0) %}
          {% set a = (s * 1000 / 690) | round(0) | int %}
          {% if s < 0.7 %}0{% elif a < 6 %}6{% elif a > 16 %}16{% else %}{{ a }}{% endif %}

      - name: "Einstecken Signal"
        unique_id: einstecken_signal
        state: >
          {% set conn = states('sensor.vestel_ev_status_connector') %}
          {% set netz = states('sensor.envoy_122323101510_aktueller_nettostromverbrauch') | float(0) %}
          {% set ue = (netz * -1) | round(1) %}
          {% if conn == 'Available' and ue >= 1.5 %}🔌 Einstecken!{% else %}✅{% endif %}

      # === Simulation: Effektive Werte (Auto/Manual via Modus) ===
      - name: "Sim Eff PV"
        unique_id: sim_eff_pv
        unit_of_measurement: "kW"
        device_class: power
        state: >
          {% set mode = states('input_select.sim_modus_2') %}
          {% if mode == 'Manual' %}
            {{ states('input_number.sim_pv_erzeugung') | float(0) }}
          {% else %}
            {{ states('sensor.envoy_122323101510_aktuelle_stromproduktion') | float(0) }}
          {% endif %}

      - name: "Sim Eff Haus"
        unique_id: sim_eff_haus
        unit_of_measurement: "kW"
        device_class: power
        state: >
          {% set mode = states('input_select.sim_modus_2') %}
          {% if mode == 'Manual' %}
            {{ states('input_number.sim_hausverbrauch') | float(0) }}
          {% else %}
            {{ states('sensor.envoy_122323101510_aktueller_stromverbrauch') | float(0) }}
          {% endif %}

      - name: "Sim Eff SoC"
        unique_id: sim_eff_soc
        unit_of_measurement: "%"
        device_class: battery
        state: >
          {% set mode = states('input_select.sim_modus_2') %}
          {% if mode == 'Manual' %}
            {{ states('input_number.sim_batterie_soc') | float(0) }}
          {% else %}
            {{ states('sensor.envoy_122323101510_batterie') | float(0) }}
          {% endif %}

      - name: "Sim Eff Strom"
        unique_id: sim_eff_strom
        unit_of_measurement: "A"
        state: >
          {% set mode = states('input_select.sim_modus_2') %}
          {% if mode == 'Manual' %}
            {{ states('input_number.sim_wallbox_strom') | float(0) }}
          {% else %}
            {{ states('number.vestel_ev_maximum_current') | float(0) }}
          {% endif %}

      # === Simulation Überschussladen (nutzt effektive Werte) ===
      - name: "Sim Ueberschuss"
        unique_id: sim_ueberschuss
        unit_of_measurement: "kW"
        device_class: power
        state: >
          {% set pv = states('sensor.sim_eff_pv') | float(0) %}
          {% set haus = states('sensor.sim_eff_haus') | float(0) %}
          {% set auto = states('sensor.sim_eff_strom') | float(0) * 0.69 %}
          {% set ein = states('input_boolean.sim_wallbox_ein') %}
          {% if ein == 'off' %}{{ (pv - haus) | round(2) }}{% else %}
            {{ (pv - haus - auto) | round(2) }}{% endif %}

      - name: "Sim Zielstrom"
        unique_id: sim_zielstrom
        unit_of_measurement: "A"
        state: >
          {% set pv = states('sensor.sim_eff_pv') | float(0) %}
          {% set haus = states('sensor.sim_eff_haus') | float(0) %}
          {% set max_a = states('sensor.sim_eff_strom') | float(0) %}
          {% set ein = states('input_boolean.sim_wallbox_ein') %}
          {% if ein == 'off' %}0{% else %}
            {% set basis = pv - haus %}
            {% set ziel = (basis * 1000 / 690) | round(0) | int %}
            {{ ziel }}{% endif %}

      - name: "Sim Endergebnis"
        unique_id: sim_endergebnis
        unit_of_measurement: "A"
        state: >
          {% set ziel = states('sensor.sim_zielstrom') | int(0) %}
          {% if ziel < 6 %}{{ 6 }}{% elif ziel > 16 %}{{ 16 }}{% else %}{{ ziel }}{% endif %}

      - name: "Sim Netzbezug"
        unique_id: sim_netzbezug
        unit_of_measurement: "kW"
        device_class: power
        state: >
          {% set pv = states('sensor.sim_eff_pv') | float(0) %}
          {% set haus = states('sensor.sim_eff_haus') | float(0) %}
          {% set end = states('sensor.sim_endergebnis') | float(0) %}
          {% set car = end * 0.69 %}
          {% set ein = states('input_boolean.sim_wallbox_ein') %}
          {% if ein == 'off' %}{{ (pv - haus) | round(2) }}{% else %}
            {{ (pv - haus - car) | round(2) }}{% endif %}

      # === Batterie Effektiv ===
      - name: "Sim Eff Batterie"
        unique_id: sim_eff_batterie
        unit_of_measurement: "kW"
        device_class: power
        state: >
          {% set mode = states('input_select.sim_modus_2') %}
          {% if mode == 'Manual' %}
            {{ states('input_number.sim_batterie_leistung') | float(0) }}
          {% else %}
            {{ states('sensor.envoy_batterieleistung') | float(0) }}
          {% endif %}

      # === Connector Effektiv ===
      - name: "Sim Eff Connector"
        unique_id: sim_eff_connector
        state: >
          {% set mode = states('input_select.sim_modus_2') %}
          {% if mode == 'Manual' %}
            {{ states('input_select.sim_connector') }}
          {% else %}
            {{ states('sensor.vestel_ev_status_connector') }}
          {% endif %}

      # Shelly Ladeziegel (W→kW)
      - name: "Ladeziegel (kW)"
        unique_id: ladeziegel_kw
        unit_of_measurement: "kW"
        state_class: measurement
        state: >
          {% set w = states('sensor.shellyplugsg3_8cbfea932ad4_power') | float(0) %}
          {{ '%.3f' | format(w / 1000) }}

  - trigger:
      - platform: state
        entity_id: input_select.sim_algo_zustand
      - platform: state
        entity_id: input_number.sim_netz
      - platform: time_pattern
        seconds: "/1"
    sensor:
      - name: "Zeit seit Statuswechsel"
        unique_id: sim_zeit_seit_wechsel
        unit_of_measurement: "s"
        icon: mdi:timer-outline
        state: >
          {% set last = states['input_select.sim_algo_zustand'].last_changed %}
          {{ (as_timestamp(now()) - as_timestamp(last)) | int }}

      - name: "Zeit seit Netzwechsel"
        unique_id: sim_zeit_seit_netzwechsel
        unit_of_measurement: "s"
        icon: mdi:timer-sync
        state: >
          {% set algo_chg = as_timestamp(states['input_select.sim_algo_zustand'].last_changed) %}
          {% set netz_chg = as_timestamp(states['input_number.sim_netz'].last_changed) %}
          {% if algo_chg > netz_chg %}
            0
          {% else %}
            {{ (as_timestamp(now()) - netz_chg) | int }}
          {% endif %}

  - sensor:
      # === Schicht 3: Effektive Werte ===
      - name: "Aktiver Knoten"
        unique_id: aktiver_knoten
        state: >
          {% set bt = states('input_select.sim_betriebsart') %}
          {% if bt == 'Aus' %}AUS
          {% elif bt == 'Sofortladen 16A' %}SOF
          {% elif bt == 'Ueberschussladen' %}
            {% set sub = states('input_select.sim_algo_zustand') %}
            {% if sub == 'Warte Überschuss' %}UE0
            {% elif sub == 'Laden 6A' %}UE6
            {% elif sub == 'Laden 7A' %}UE7
            {% elif sub == 'Laden 8A' %}UE8
            {% elif sub == 'Laden 9A' %}UE9
            {% elif sub == 'Laden 10A' %}UE10
            {% else %}UEB{% endif %}
          {% elif bt == 'Voll bis Morgen' %}VBM
          {% else %}AUS{% endif %}

      # Vergleichswert für Schwellenvergleich (Up & Down, beide identisch)
      # Zeigt den Wert, der mit den Schwellen an den Pfeilen verglichen wird.
      # Ohne Batterie-Entladung: nur netz+netz−bat (kein -1,3 mehr)
      - name: "Vergleichswert"
        unique_id: vergleichswert
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: >
          {% set netz = states('input_number.sim_netz') | float(0) %}
          {% set bat = states('input_number.sim_batterie_leistung') | float(0) %}
          {{ (netz + bat) | round(2) }}

      # Batterieentladung (nur positive Werte)
      - name: "Batterieentladung Leistung"
        unique_id: batterieentladung_leistung
        unit_of_measurement: "kW"
        device_class: power
        state_class: measurement
        state: >
          {% set b = states('sensor.envoy_batterieleistung') | float(0) %}
          {% if b > 0 %}{{ b }}{% else %}0{% endif %}

      # Übergänge vom aktuellen Zustand (für Dashboard)
      - name: "Aktuelle Übergänge"
        unique_id: aktuelle_uebergaenge
        state: >
          {%- set bt = states('input_select.sim_betriebsart') -%}
          {%- if bt == 'Aus' -%}
          🔄 Aus: → Überschussladen / → Sofortladen 16A
          {%- elif bt == 'Sofortladen 16A' -%}
          🔄 Sofortladen: → Überschussladen / → Aus
          {%- elif bt == 'Ueberschussladen' -%}
          {%- set state = states('input_select.sim_algo_zustand') -%}
          {%- if state == 'Warte Überschuss' -%}
          🔄 Warte: →6A ≤ -4,14 | Aus | 16A
          {%- elif state == 'Laden 6A' -%}
          🔄 6A: →7A ≤ -4,83 | →Warte > 0 | Aus | 16A
          {%- elif state == 'Laden 7A' -%}
          🔄 7A: →8A ≤ -5,52 | →6A > 0 | Warte | Aus | 16A
          {%- elif state == 'Laden 8A' -%}
          🔄 8A: →9A ≤ -6,21 | →7A > 0 | Warte | Aus | 16A
          {%- elif state == 'Laden 9A' -%}
          🔄 9A: →10A ≤ -6,90 | →8A > 0 | Warte | Aus | 16A
          {%- elif state == 'Laden 10A' -%}
          🔄 10A: →9A > 0 | Warte | Aus | 16A
          {%- else -%}
          🔄 Überschuss: {{ state }}
          {%- endif -%}
          {%- else -%}
          🔄 {{ bt }}: {{ states('input_select.sim_algo_zustand') }}
          {%- endif -%}
        icon: mdi:transfer
    binary_sensor:
      # Ladeziegel-Status: < 3 W = aus, ≥ 3 W = an
      # Erkennt, ob der Ladeziegel wirklich Leistung zieht oder nur Standby ist
      - name: "Ladeziegel aus/ein"
        unique_id: ladeziegel_status
        device_class: power
        state: >
          {% set leistung = states('sensor.ladeziegel_kw') | float(0) %}
          {{ 'on' if leistung >= 0.003 else 'off' }}

sensor:
  - platform: integration
    name: "Produktion heute"
    unique_id: produktion_heute
    source: sensor.envoy_122323101510_aktuelle_stromproduktion
    unit_time: h
    round: 2
    method: left

  - platform: integration
    name: "Verbrauch heute"
    unique_id: verbrauch_heute
    source: sensor.envoy_122323101510_aktueller_stromverbrauch
    unit_time: h
    round: 2
    method: left

  - platform: integration
    name: "Netzimport heute"
    unique_id: netzimport_heute
    source: sensor.netzimport_leistung
    unit_time: h
    round: 2
    method: left

  - platform: integration
    name: "Netzeinspeisung heute"
    unique_id: netzeinspeisung_heute
    source: sensor.netzeinspeisung_leistung
    unit_time: h
    round: 2
    method: left

  - platform: integration
    name: "Batterieladung heute"
    unique_id: batterieladung_heute
    source: sensor.batterieladung_leistung
    unit_time: h
    round: 2
    method: left

  - platform: integration
    name: "Batterieentladung heute"
    unique_id: batterieentladung_heute
    source: sensor.batterieentladung_leistung
    unit_time: h
    round: 2
    method: left


input_number:
  verzoegerung_wechsel:
    name: "Verzögerung Netzwechsel"
    min: 0
    max: 30
    step: 1
    initial: 5
    unit_of_measurement: "s"
    icon: mdi:timer-sync
    mode: slider

utility_meter:
  produktion_tag:
    source: sensor.produktion_heute
    cycle: daily
  verbrauch_tag:
    source: sensor.verbrauch_heute
    cycle: daily
  netzimport_tag:
    source: sensor.netzimport_heute
    cycle: daily
  netzeinspeisung_tag:
    source: sensor.netzeinspeisung_heute
    cycle: daily
  batterieladung_tag:
    source: sensor.batterieladung_heute
    cycle: daily
  batterieentladung_tag:
    source: sensor.batterieentladung_heute
    cycle: daily
  wallbox_tag:
    source: sensor.wallbox_heute
    cycle: daily
