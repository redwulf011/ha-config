- id: "set_start_defaults"
  alias: "SET - Defaults bei Start"
  trigger:
    - platform: homeassistant
      event: start
  action:
    - action: input_select.select_option
      target:
        entity_id: input_select.aktoren_modus
      data:
        option: "Aktiv"
    - action: input_select.select_option
      target:
        entity_id: input_select.sim_modus_2
      data:
        option: "Auto"
    - action: input_select.select_option
      target:
        entity_id: input_select.sim_betriebsart
      data:
        option: "Ueberschussladen"

- id: "algo_sofortladen"
  alias: "ALGO - Zustand Sofortladen"
  trigger:
    - platform: homeassistant
      event: start
    - platform: state
      entity_id: input_select.sim_betriebsart
      to: "Sofortladen 16A"
  action:
    - action: input_select.select_option
      target:
        entity_id: input_select.sim_algo_zustand
      data:
        option: "Sofortladen"
    - action: input_number.set_value
      target:
        entity_id: input_number.sim_actor_strom
      data:
        value: 16
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.sim_actor_wallbox

- id: "algo_aus"
  alias: "ALGO - Zustand Aus"
  trigger:
    - platform: homeassistant
      event: start
    - platform: state
      entity_id: input_select.sim_betriebsart
      to: "Aus"
  action:
    - action: input_select.select_option
      target:
        entity_id: input_select.sim_algo_zustand
      data:
        option: "Aus"
    - action: input_number.set_value
      target:
        entity_id: input_number.sim_actor_strom
      data:
        value: 6
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.sim_actor_wallbox

- id: "reset_betriebsart"
  alias: "Reset Betriebsart bei Stecker aus"
  trigger:
    - platform: state
      entity_id: sensor.sim_eff_connector
      to: "Available"
  condition:
    - condition: not
      conditions:
        - condition: state
          entity_id: input_select.sim_betriebsart
          state: "Ueberschussladen"
  action:
    - action: input_select.select_option
      target:
        entity_id: input_select.sim_betriebsart
      data:
        option: "Ueberschussladen"
- id: "sim_auto_sync_slider"
  alias: "SIM - Auto Sync Slider"
  trigger:
    - platform: homeassistant
      event: start
    - platform: time_pattern
      seconds: "/1"
    - platform: state
      entity_id: input_select.sim_modus_2
      to: Auto
  condition:
    - condition: state
      entity_id: input_select.sim_modus_2
      state: Auto
  action:
    - action: input_number.set_value
      target:
        entity_id: input_number.sim_pv_erzeugung
      data:
        value: "{{ states('sensor.envoy_122323101510_aktuelle_stromproduktion') | float(0) | round(2) }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.sim_hausverbrauch
      data:
        value: "{{ states('sensor.envoy_122323101510_aktueller_stromverbrauch') | float(0) | round(2) }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.sim_batterie_soc
      data:
        value: "{{ states('sensor.envoy_122323101510_batterie') | float(0) | round(0) }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.sim_wallbox_strom
      data:
        value: "{{ states('number.vestel_ev_maximum_current') | float(0) | round(0) }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.sim_netz
      data:
        value: "{{ states('sensor.envoy_122323101510_aktueller_nettostromverbrauch') | float(0) | round(2) }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.sim_batterie_leistung
      data:
        value: "{{ states('sensor.envoy_batterieleistung') | float(0) | round(2) }}"
    - action: input_select.select_option
      target:
        entity_id: input_select.sim_connector
      data:
        option: "{{ states('sensor.vestel_ev_status_connector') }}"
    - choose:
        - conditions:
            - condition: state
              entity_id: switch.vestel_ev_charge_control
              state: "on"
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.sim_wallbox_ein
        - conditions:
            - condition: state
              entity_id: switch.vestel_ev_charge_control
              state: "off"
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.sim_wallbox_ein

- id: "sim_modus_auto"
  alias: "SIM - Modus Auto"
  trigger:
    - platform: state
      entity_id: input_select.sim_modus_2
      to: Auto
  action:
    - action: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.sim_man_pv
          - input_boolean.sim_man_haus
          - input_boolean.sim_man_soc
          - input_boolean.sim_man_strom

- id: "sim_modus_manual"
  alias: "SIM - Modus Manual"
  trigger:
    - platform: state
      entity_id: input_select.sim_modus_2
      to: Manual
  action:
    - action: input_boolean.turn_on
      target:
        entity_id:
          - input_boolean.sim_man_pv
          - input_boolean.sim_man_haus
          - input_boolean.sim_man_soc
          - input_boolean.sim_man_strom

- id: "sub_entry_ueberschussladen"
  alias: "SUB - Eintritt Ueberschussladen"
  mode: single
  trigger:
    - platform: state
      entity_id: input_select.sim_betriebsart
      to: "Ueberschussladen"
    - platform: state
      entity_id: input_select.sim_betriebsart_2
      to: "Ueberschussladen"
  action:
    # Erst Actor ausschalten, DANN State setzen — so triggert
    # SUB Warte→Laden nicht die Entry-Actions rückgängig
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.sim_actor_wallbox
    - action: input_number.set_value
      target:
        entity_id: input_number.sim_actor_strom
      data:
        value: 6
    - action: input_select.select_option
      target:
        entity_id: input_select.sim_algo_zustand
      data:
        option: "Warte Überschuss"

- id: "sub_warte_zu_laden"
  alias: "SUB - Warte → Laden 6A"
  mode: restart
  trigger:
    - platform: state
      entity_id: input_select.sim_algo_zustand
      to: "Warte Überschuss"
    - platform: state
      entity_id: input_number.sim_netz
    - platform: time_pattern
      seconds: "/5"
  condition:
    - condition: state
      entity_id: input_select.sim_betriebsart_2
      state: "Ueberschussladen"
    - condition: state
      entity_id: input_select.sim_algo_zustand
      state: "Warte Überschuss"
    - condition: template
      value_template: >
        {% set netz = states('input_number.sim_netz') | float(0) %}
        {% set bat = states('input_number.sim_batterie_leistung') | float(0) %}
        {% set soc = states('sensor.sim_eff_soc') | float(0) %}
        {% set last = states['input_select.sim_algo_zustand'].last_changed %}
        {% set zeit = (as_timestamp(now()) - as_timestamp(last)) | int %}
        {% set delay = states('input_number.verzoegerung_wechsel') | int(0) %}
        {% if soc >= 20 %}
          {{ netz + bat - 1.3 <= -4.14 and zeit >= delay }}
        {% else %}
          {{ netz + bat <= -4.14 and zeit >= delay }}
        {% endif %}
  action:
    - action: input_select.select_option
      target:
        entity_id: input_select.sim_algo_zustand
      data:
        option: "Laden 6A"
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.sim_actor_wallbox
    - action: input_number.set_value
      target:
        entity_id: input_number.sim_actor_strom
      data:
        value: 6

- id: "sub_laden_zu_warte"
  alias: "SUB - Laden 6A → Warte"
  mode: restart
  trigger:
    - platform: state
      entity_id: input_select.sim_algo_zustand
      to: "Laden 6A"
    - platform: state
      entity_id: input_number.sim_netz
    - platform: time_pattern
      seconds: "/5"
  condition:
    - condition: state
      entity_id: input_select.sim_betriebsart_2
      state: "Ueberschussladen"
    - condition: or
      conditions:
        - condition: state
          entity_id: input_select.sim_algo_zustand
          state: "Laden 6A"
    - condition: template
      value_template: >
        {% set netz = states('input_number.sim_netz') | float(0) %}
        {% set bat = states('input_number.sim_batterie_leistung') | float(0) %}
        {% set soc = states('sensor.sim_eff_soc') | float(0) %}
        {% set last = states['input_select.sim_algo_zustand'].last_changed %}
        {% set zeit = (as_timestamp(now()) - as_timestamp(last)) | int %}
        {% set delay = states('input_number.verzoegerung_wechsel') | int(0) %}
        {% if soc >= 10 %}
          {{ netz + bat - 1.3 > 0 and zeit >= delay }}
        {% else %}
          {{ netz + bat > 0 and zeit >= delay }}
        {% endif %}
  action:
    - action: input_select.select_option
      target:
        entity_id: input_select.sim_algo_zustand
      data:
        option: "Warte Überschuss"
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.sim_actor_wallbox

# === BRIDGE: SIM-Aktoren → Echte Wallbox ===

- id: "bridge_actor_wallbox"
  alias: "BRIDGE - Wallbox Ein/Aus"
  mode: restart
  trigger:
    - platform: state
      entity_id: input_boolean.sim_actor_wallbox
    - platform: state
      entity_id: input_select.aktoren_modus
      to: "Aktiv"
  condition:
    - condition: state
      entity_id: input_select.aktoren_modus
      state: "Aktiv"
  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.sim_actor_wallbox
              state: "on"
          sequence:
            - action: switch.turn_on
              target:
                entity_id: switch.vestel_ev_charge_control
        - conditions:
            - condition: state
              entity_id: input_boolean.sim_actor_wallbox
              state: "off"
          sequence:
            - action: switch.turn_off
              target:
                entity_id: switch.vestel_ev_charge_control

- id: "bridge_actor_strom"
  alias: "BRIDGE - Wallbox Strom"
  mode: restart
  trigger:
    - platform: state
      entity_id: input_number.sim_actor_strom
    - platform: state
      entity_id: input_select.aktoren_modus
      to: "Aktiv"
  condition:
    - condition: state
      entity_id: input_select.aktoren_modus
      state: "Aktiv"
  action:
    - action: number.set_value
      target:
        entity_id: number.vestel_ev_maximum_current
      data:
        value: "{{ states('input_number.sim_actor_strom') | int(0) }}"

