- id: "dynamisches_laden_anpassen"
  alias: "DL - Strom dynamisch anpassen"
  description: "Passt Ladestrom alle 60s an PV-Überschuss an (3-phasig, 6-16A)"
  mode: restart
  trigger:
    - platform: numeric_state
      entity_id: sensor.envoy_122323101510_ausgeglichene_nettoleistungsaufnahme
      below: -0.3
    - platform: numeric_state
      entity_id: sensor.envoy_122323101510_ausgeglichene_nettoleistungsaufnahme
      above: 0.2
    - platform: state
      entity_id: switch.vestel_ev_charge_control
      to: "on"
  condition:
    - condition: state
      entity_id: switch.vestel_ev_charge_control
      state: "on"
  action:
    - repeat:
        while:
          - condition: state
            entity_id: switch.vestel_ev_charge_control
            state: "on"
        sequence:
          - variables:
              surplus_kw: "{{ (states('sensor.envoy_122323101510_ausgeglichene_nettoleistungsaufnahme') | float(0)) * -1 }}"
              # 3-phasig: surplus_kW * 1000 / (3 * 230V) = surplus_kW * 1000 / 690
              # Gerundet auf nächsten vollen Ampere
              target_amps: >
                {% set a = (surplus_kw * 1000 / 690) | round(0) %}
                {% if a < 6 %}{{ 6 }}{% elif a > 16 %}{{ 16 }}{% else %}{{ a }}{% endif %}
          - action: number.set_value
            target:
              entity_id: number.vestel_ev_maximum_current
            data:
              value: "{{ target_amps }}"
          - delay:
              seconds: 60

- id: "dynamisches_laden_start"
  alias: "DL - Start bei Solarüberschuss"
  description: "Startet Laden wenn ≥4,0kW Überschuss für 2 Minuten (min 6A = 4,14kW)"
  trigger:
    - platform: numeric_state
      entity_id: sensor.envoy_122323101510_ausgeglichene_nettoleistungsaufnahme
      below: -4.0
      for:
        minutes: 2
  condition:
    - condition: state
      entity_id: switch.vestel_ev_charge_control
      state: "off"
  action:
    - variables:
        surplus_kw: "{{ (states('sensor.envoy_122323101510_ausgeglichene_nettoleistungsaufnahme') | float(0)) * -1 }}"
        start_amps: "{{ ((surplus_kw * 1000 / 690) | round(0)) | max(6) | min(16) }}"
    - action: number.set_value
      target:
        entity_id: number.vestel_ev_maximum_current
      data:
        value: "{{ start_amps }}"
    - action: switch.turn_on
      target:
        entity_id: switch.vestel_ev_charge_control

- id: "dynamisches_laden_stop"
  alias: "DL - Stop bei wenig Sonne"
  description: "Stoppt wenn Überschuss <0,5kW für 5 Minuten"
  trigger:
    - platform: numeric_state
      entity_id: sensor.envoy_122323101510_ausgeglichene_nettoleistungsaufnahme
      above: -0.5
      for:
        minutes: 5
  condition:
    - condition: state
      entity_id: switch.vestel_ev_charge_control
      state: "on"
  action:
    - action: switch.turn_off
      target:
        entity_id: switch.vestel_ev_charge_control
