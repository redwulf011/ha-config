
- id: "algo_sofortladen"
  alias: "ALGO - Zustand Sofortladen"
  trigger:
    - platform: homeassistant
      event: start
    - platform: state
      entity_id: input_select.sim_betriebsart
      to: "Sofortladen 16A"
  action:
    - action: input_number.set_value
      target:
        entity_id: input_number.sim_actor_strom
      data:
        value: 16
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.sim_actor_wallbox

- id: "algo_aus"
  alias: "ALGO - Zustand Aus"
  trigger:
    - platform: homeassistant
      event: start
    - platform: state
      entity_id: input_select.sim_betriebsart
      to: "Aus"
  action:
    - action: input_number.set_value
      target:
        entity_id: input_number.sim_actor_strom
      data:
        value: 6
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.sim_actor_wallbox

- id: "reset_betriebsart"
  alias: "Reset Betriebsart bei Stecker aus"
  trigger:
    - platform: state
      entity_id: sensor.sim_eff_connector
      to: "Available"
  condition:
    - condition: not
      conditions:
        - condition: state
          entity_id: input_select.sim_betriebsart
          state: "Ueberschussladen"
  action:
    - action: input_select.select_option
      target:
        entity_id: input_select.sim_betriebsart
      data:
        option: "Ueberschussladen"
- id: "sim_auto_sync_slider"
  alias: "SIM - Auto Sync Slider"
  trigger:
    - platform: homeassistant
      event: start
    - platform: time_pattern
      seconds: "/1"
    - platform: state
      entity_id: input_select.sim_modus_2
      to: Auto
  condition:
    - condition: state
      entity_id: input_select.sim_modus_2
      state: Auto
  action:
    - action: input_number.set_value
      target:
        entity_id: input_number.sim_pv_erzeugung
      data:
        value: "{{ states('sensor.envoy_122323101510_aktuelle_stromproduktion') | float(0) | round(2) }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.sim_hausverbrauch
      data:
        value: "{{ states('sensor.envoy_122323101510_aktueller_stromverbrauch') | float(0) | round(2) }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.sim_batterie_soc
      data:
        value: "{{ states('sensor.envoy_122323101510_batterie') | float(0) | round(0) }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.sim_wallbox_strom
      data:
        value: "{{ states('number.vestel_ev_maximum_current') | float(0) | round(0) }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.sim_netz
      data:
        value: "{{ states('sensor.envoy_122323101510_aktueller_nettostromverbrauch') | float(0) | round(2) }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.sim_batterie_leistung
      data:
        value: "{{ states('sensor.envoy_batterieleistung') | float(0) | round(2) }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.sim_s3_batterie
      data:
        value: "{{ states('sensor.envoy_batterieleistung') | float(0) | round(2) }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.sim_s3_ueberschuss
      data:
        value: "{{ states('sensor.pv_uberschuss') | float(0) | round(2) }}"
    - action: input_select.select_option
      target:
        entity_id: input_select.sim_connector
      data:
        option: "{{ states('sensor.vestel_ev_status_connector') }}"
    - choose:
        - conditions:
            - condition: state
              entity_id: switch.vestel_ev_charge_control
              state: "on"
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.sim_wallbox_ein
        - conditions:
            - condition: state
              entity_id: switch.vestel_ev_charge_control
              state: "off"
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.sim_wallbox_ein

- id: "sim_modus_auto"
  alias: "SIM - Modus Auto"
  trigger:
    - platform: state
      entity_id: input_select.sim_modus_2
      to: Auto
  action:
    - action: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.sim_man_pv
          - input_boolean.sim_man_haus
          - input_boolean.sim_man_soc
          - input_boolean.sim_man_strom

- id: "sim_modus_manual"
  alias: "SIM - Modus Manual"
  trigger:
    - platform: state
      entity_id: input_select.sim_modus_2
      to: Manual
  action:
    - action: input_boolean.turn_on
      target:
        entity_id:
          - input_boolean.sim_man_pv
          - input_boolean.sim_man_haus
          - input_boolean.sim_man_soc
          - input_boolean.sim_man_strom

- id: "sim_s3_sync"
  alias: "SIM - S3 Sync"
  trigger:
    - platform: homeassistant
      event: start
    - platform: time_pattern
      seconds: "/1"
    - platform: state
      entity_id: input_select.sim_s3_modus
      to: Auto
  condition:
    - condition: state
      entity_id: input_select.sim_s3_modus
      state: Auto
  action:
    - action: input_number.set_value
      target:
        entity_id: input_number.sim_s3_batterie
      data:
        value: "{{ states('sensor.envoy_batterieleistung') | float(0) | round(2) }}"
    - action: input_number.set_value
      target:
        entity_id: input_number.sim_s3_ueberschuss
    - action: input_select.select_option
      target:
        entity_id: input_select.sim_connector
      data:
        option: "{{ states('sensor.vestel_ev_status_connector') }}"

      data:
        value: "{{ states('sensor.pv_uberschuss') | float(0) | round(2) }}"

# === SUB: Eingebetteter Zustandsautomat für Überschussladen ===

- id: "sub_warte_zu_laden"
  alias: "SUB - Warte → Laden 6A"
  mode: restart
  trigger:
    - platform: state
      entity_id: input_select.sim_algo_zustand
      to: "Warte Überschuss"
    - platform: state
      entity_id: sensor.sim_ueberschuss
    - platform: state
      entity_id: sensor.sim_eff_batterie
  condition:
    - condition: state
      entity_id: input_select.sim_betriebsart_2
      state: "Ueberschussladen"
    - condition: state
      entity_id: input_select.sim_algo_zustand
      state: "Warte Überschuss"
    - condition: template
      value_template: >
        {% set ueb = states('sensor.sim_ueberschuss') | float(0) %}
        {% set bat = states('sensor.sim_eff_batterie') | float(0) %}
        {% set soc = states('sensor.sim_eff_soc') | float(0) %}
        {% set net = ueb - bat %}
        {% if soc < 80 %}
          {{ net >= 4.24 }}
        {% else %}
          {{ net >= 4.14 }}
        {% endif %}
  action:
    - action: input_select.select_option
      target:
        entity_id: input_select.sim_algo_zustand
      data:
        option: "Laden 6A"
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.sim_actor_wallbox
    - action: input_number.set_value
      target:
        entity_id: input_number.sim_actor_strom
      data:
        value: 6

- id: "sub_laden_zu_warte"
  alias: "SUB - Laden 6A → Warte"
  mode: restart
  trigger:
    - platform: state
      entity_id: input_select.sim_algo_zustand
      to: "Laden 6A"
    - platform: state
      entity_id: sensor.sim_ueberschuss
    - platform: state
      entity_id: sensor.sim_eff_batterie
  condition:
    - condition: state
      entity_id: input_select.sim_betriebsart_2
      state: "Ueberschussladen"
    - condition: state
      entity_id: input_select.sim_algo_zustand
      state: "Laden 6A"
    - condition: template
      value_template: >
        {% set ueb = states('sensor.sim_ueberschuss') | float(0) %}
        {% set bat = states('sensor.sim_eff_batterie') | float(0) %}
        {% set soc = states('sensor.sim_eff_soc') | float(0) %}
        {% set net = ueb - bat %}
        {% if soc < 80 %}
          {{ net <= 4.14 }}
        {% else %}
          {{ net <= 4.04 }}
        {% endif %}
  action:
    - action: input_select.select_option
      target:
        entity_id: input_select.sim_algo_zustand
      data:
        option: "Warte Überschuss"
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.sim_actor_wallbox
